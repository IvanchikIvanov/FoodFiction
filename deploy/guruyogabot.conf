# Food Fiction knowledge assistant
server {
    listen 80;
    listen [::]:80;
    server_name guruyogabot.ru www.guruyogabot.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://guruyogabot.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.guruyogabot.ru;

    ssl_certificate /etc/letsencrypt/live/guruyogabot.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guruyogabot.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://guruyogabot.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name guruyogabot.ru;

    ssl_certificate /etc/letsencrypt/live/guruyogabot.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guruyogabot.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/guruyogabot.access.log;
    error_log /var/log/nginx/guruyogabot.error.log;

    client_max_body_size 32k;

    # Administrative and server-to-server APIs are available only on localhost.
    location ~ ^/(admin|internal)(/|$) {
        return 404;
    }

    location = /api/web/transcribe {
        client_max_body_size 4m;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 190s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
