# Install as /etc/systemd/system/food-fiction.service.d/20-bitrix.conf
# only after settings.json contains approved, accessible source IDs.
[Service]
# Override only the Bitrix credential; preserve administrative, web and Hermes secrets.
EnvironmentFile=/etc/food-fiction-bitrix-626.env
Environment=HERMES_WEB_SEARCH=false
ExecStart=
ExecStart=/root/Rom/.venv311/bin/python -m uvicorn knowledge.app:create_app --factory --host 127.0.0.1 --port 8081 --workers 1
